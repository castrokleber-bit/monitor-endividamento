name: Atualiza dados e publica

# QUINZENAL desde 19/09/2026 (antes era diário, dias úteis).
#
# As séries de crédito do Banco Central são mensais e saem uma vez por mês, no fim do mês
# seguinte ao de referência; as do BIS são trimestrais, com um a dois trimestres de
# defasagem. Rodar todo dia útil recommitava artefatos idênticos vinte vezes por mês e
# enchia o histórico do repositório de ruído. Dias 1 e 16 pegam a divulgação mensal com
# folga e mantêm o painel com no máximo quinze dias de atraso em relação à fonte.
on:
  schedule:
    # 21:00 UTC = 18:00 BRT, dias 1 e 16 — fim da tarde de Brasília, depois da janela
    # usual de divulgação do BCB. O Brasil não adota horário de verão desde 2019, então
    # o offset é fixo e o horário local não muda ao longo do ano.
    - cron: "0 21 1,16 * *"
  workflow_dispatch:

# Uma execução por vez. Sem isto, um disparo manual durante o cron fazia as duas
# commitarem: o push da segunda era recusado (non-fast-forward), o job falhava e abria
# um falso alarme na issue, e os dois deploys do Pages podiam colidir. A segunda espera
# a primeira terminar, em vez de cancelá-la no meio de um commit.
concurrency:
  group: atualiza-dados
  cancel-in-progress: false

# Permissões por job, não no workflow: o job de coleta instala pacotes de terceiros e não
# precisa publicar no Pages; o de publicação não precisa escrever no repositório.
permissions: {}

jobs:
  atualiza:
    runs-on: ubuntu-latest
    # Teto do job inteiro. Os steps têm tetos próprios, menores; este é a última trava
    # para o limite padrão de seis horas do GitHub nunca ser atingido.
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # O cache de payloads entre execuções é o que faz a política de falha do CLAUDE.md
      # existir no CI. `data/_cache/` não é versionado, então sem isto cada execução é
      # partida fria: uma série que falha na coleta não tem cache anterior para reusar,
      # vai direto para `ausente` em vez de `stale`, e derruba o guard de regressão.
      # Foi o que aconteceu em 19/09/2026 — dez séries do crédito ampliado falharam numa
      # instabilidade do BCB e o job parou com código 2. O retry de `fetch_bcb` trata a
      # causa; isto é a rede de segurança para quando a fonte cair de verdade.
      #
      # `restore-keys` faz a execução pegar o cache mais recente que existir, já que a
      # chave carrega o id da execução e nunca bate exatamente.
      #
      # O GitHub APAGA cache sem acesso há mais de 7 dias, e este workflow roda a cada
      # 15. Quem mantém o cache vivo entre uma execução e outra é mantem-cache.yml.
      - name: Cache dos payloads da última coleta
        uses: actions/cache@v6
        with:
          path: data/_cache
          key: sgs-cache-${{ github.run_id }}
          restore-keys: sgs-cache-

      - name: Testa as transformações
        run: python -m unittest discover -s tests

      # Tetos por step (04/10/2026): com o SGS engolindo conexões, cada série custava
      # minutos de timeout e retry, e a execução podia levar horas antes de falhar. O
      # disjuntor de src/ corta isso; os tetos garantem que nada passe deles.
      - name: Valida códigos de série
        timeout-minutes: 30
        run: python src/validate_series.py

      # build_dataset.py sai com 1 se o catálogo ficou inconsistente (série citada e não
      # declarada, residual negativo, identidade de config/identidades.yaml que não
      # fecha, % do PIB divergindo do oficial do BCB) e com 2 se a cobertura regrediu —
      # série que tinha dado e sumiu. Nos dois casos nenhum artefato é escrito, o step
      # falha, o job para e NADA é commitado: é o gate contra publicar dado parcial.
      - name: Coleta e consolida
        timeout-minutes: 45
        run: |
          python src/build_dataset.py
          python src/build_xlsx.py

      - name: Commita se houver mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/ recebe dados.js e a planilha porque o Pages publica só essa pasta.
          # index.html entra porque build_dataset.carimba_versao() reaplica o `?v=<hash>`
          # dos estáticos: se alguém fez push de app.js sem rodar o build, o carimbo
          # velho seria publicado com o JS novo — a combinação que já deixou a página
          # em branco. Quando o carimbo está certo, o arquivo não muda e nada entra.
          git add data/ docs/dados.js docs/monitor_endividamento.xlsx docs/index.html
          git diff --staged --quiet || git commit -m "dados: atualização automática $(date -u +%Y-%m-%d)"
          # Um push humano pode ter chegado durante a coleta. O commit do bot só toca os
          # artefatos gerados, então o rebase é limpo; se não for, o step falha alto.
          git pull --rebase origin main
          git push

      # Falha de coleta não pode passar em silêncio: o painel continuaria no ar com o
      # snapshot anterior e ninguém saberia. A issue é aberta uma vez e reaproveitada
      # enquanto estiver aberta, para que uma fonte fora do ar por uma semana não gere
      # uma issue por execução.
      # `cancelled()` cobre o estouro do teto do job, que cancela em vez de falhar — sem
      # isso a falha mais longa de todas seria a única a passar em silêncio. O custo é
      # que um cancelamento manual também comenta na issue.
      - name: Abre issue se a atualização falhou
        if: failure() || cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const titulo = 'Atualização automática falhou';
            const corpo = [
              'A execução quinzenal do pipeline falhou e **nada foi publicado** — o site',
              'segue com o snapshot anterior, como manda a política de não publicar dado',
              'parcial.',
              '',
              `Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Causas prováveis, em ordem de frequência:',
              '- fonte fora do ar ou devolvendo erro mascarado (HTTP 200 com corpo de erro);',
              '- código de série retirado ou renomeado no SGS ou no BIS;',
              '- identidade contábil que deixou de fechar após revisão da fonte.',
              '',
              'Esta issue é reaproveitada enquanto estiver aberta. Feche-a quando a',
              'atualização voltar a passar.',
            ].join('\n');

            const abertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline',
            });
            const existente = abertas.data.find(i => i.title === titulo);

            if (existente) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existente.number,
                body: `Falhou de novo em ${new Date().toISOString()}. ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: titulo,
                body: corpo,
                labels: ['pipeline'],
              });
            }

  # PUBLICAÇÃO NO GITHUB PAGES.
  #
  # Controlada pela variável de repositório PUBLICAR_PAGES. O go live é decisão humana
  # (ver CLAUDE.md), e a chave é uma variável nas configurações — e não uma edição neste
  # arquivo — de propósito: ligar a publicação vira um ato explícito e auditável, em vez
  # de um commit que passa despercebido numa revisão.
  #
  #   Settings -> Secrets and variables -> Actions -> Variables
  #   nome: PUBLICAR_PAGES   valor: true
  #   e Settings -> Pages -> Source: GitHub Actions.
  publica:
    needs: atualiza
    if: vars.PUBLICAR_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
