# Catálogo de séries DERIVADAS — calculadas a partir de séries já coletadas.
#
# Nada aqui vai à rede. Cada série deste arquivo é uma função determinística de séries
# do catálogo de coleta, implementada em `src/derivadas.py` e descrita em
# `content/metodologia.md`. Nenhuma série derivada entra no painel sem esse par: a regra
# no YAML e a nota metodológica escrita.
#
# ATENÇÃO — o que NÃO está aqui. As quatro bases do seletor "Base de valores"
# (R$ correntes, R$ constantes, % do PIB, variação em 12 meses) NÃO são séries
# derivadas: são transformações aplicadas a qualquer série cujo catálogo declare a base
# em `bases`, implementadas em `src/transformacoes.py`. Este arquivo trata só de séries
# novas, que não existem em fonte nenhuma: residuais, somas e médias ponderadas.
#
# Operações implementadas:
#   residual         total − soma(componentes). Fecha a composição de um gráfico de saldo
#   soma             soma(componentes). Usada onde a fonte não publica um "Total"
#   media_ponderada  Σ(taxa_i × peso_i) / Σ(peso_i). Para agregar taxas, que não somam
#
# Em todas elas, uma data só entra no resultado quando TODAS as séries envolvidas têm
# observação naquela data. Nada é interpolado, extrapolado ou arredondado.

fonte: Derivado

series:

  # ---------------------------------------------------------------------------
  # G8 — parcela residual do crédito livre a pessoas jurídicas
  #
  # As seis modalidades exibidas cobrem 65% do saldo em 07/2026. O residual garante que
  # as parcelas do gráfico fechem exatamente no total publicado (20543) e reúne capital
  # de giro rotativo, conta garantida, cheque especial PJ, cartão de crédito PJ,
  # financiamento a importações, repasses externos, arrendamento e demais modalidades
  # que a Tabela 6 abre individualmente.
  #
  # Este "Outros" NÃO tem a mesma abrangência do "Outros" do gráfico de inadimplência
  # (G12), que é a série 21111 do próprio BCB. A Metodologia avisa disso.
  # ---------------------------------------------------------------------------
  - serie_id: livre_pj_outros
    operacao: residual
    total: sfn_livre_pj
    componentes:
      - livre_pj_capital_giro_acima_365d
      - livre_pj_capital_giro_ate_365d
      - livre_pj_duplicatas
      - livre_pj_veiculos
      - livre_pj_exportacoes
      - livre_pj_acc
    rotulo: "Outras modalidades"
    cor: outros
    unidade: "R$ milhões"
    fator: 0.001
    unidade_exibicao: "R$ bilhões"
    segmento: empresa
    bases: [nominal, real, pib, var1m, var12m]
    descricao_esperada: "Saldo do crédito livre a pessoas jurídicas — modalidades não exibidas (residual)"

  # ---------------------------------------------------------------------------
  # G9 — parcela residual do crédito livre a pessoas físicas
  #
  # As quatro modalidades exibidas cobrem 91% do saldo em 07/2026. O residual reúne
  # composição de dívidas, cheque especial, crédito pessoal com garantia, aquisição de
  # outros bens, arrendamento, desconto de cheques e demais modalidades da Tabela 7.
  # ---------------------------------------------------------------------------
  - serie_id: livre_pf_outros
    operacao: residual
    total: sfn_livre_pf
    componentes:
      - livre_pf_consignado
      - livre_pf_nao_consignado
      - livre_pf_cartao
      - livre_pf_veiculos
    rotulo: "Outras modalidades"
    cor: outros
    unidade: "R$ milhões"
    fator: 0.001
    unidade_exibicao: "R$ bilhões"
    segmento: familia
    bases: [nominal, real, pib, var1m, var12m]
    descricao_esperada: "Saldo do crédito livre a pessoas físicas — modalidades não exibidas (residual)"

  # ---------------------------------------------------------------------------
  # G14 — total do crédito PJ por porte (Tabela 23)
  #
  # O SGS não publica código de total para a Tabela 23. Varridos, em 19/09/2026, os
  # intervalos 22020-22026, 22045-22055 e 27695-27710 sem encontrar a coluna "Total".
  # A soma é validada por cruzamento contra a soma independente da Tabela 24
  # (`ativ_total`): as duas fecham com diferença máxima de R$ 5 milhões em 175 meses,
  # sobre um estoque de R$ 2,7 trilhões — 0,0003%.
  #
  # Este total NÃO coincide com o das Tabelas 2 e 3: a base é o SCR e exclui operações
  # com entidades de intermediação financeira.
  # ---------------------------------------------------------------------------
  - serie_id: porte_total
    operacao: soma
    componentes: [porte_mpme, porte_grande]
    rotulo: "Total"
    cor: total
    unidade: "R$ milhões"
    fator: 0.001
    unidade_exibicao: "R$ bilhões"
    segmento: empresa
    papel: total
    bases: [nominal, real, pib, var1m, var12m]
    descricao_esperada: "Saldo da carteira de crédito a pessoas jurídicas — total por porte (soma calculada)"

  # ---------------------------------------------------------------------------
  # G16 — total do crédito PJ por atividade econômica (Tabela 24)
  # Mesma situação da Tabela 23: sem código de total no SGS.
  # ---------------------------------------------------------------------------
  - serie_id: ativ_total
    operacao: soma
    componentes: [ativ_agropecuaria, ativ_industria, ativ_servicos, ativ_outros]
    rotulo: "Total"
    cor: total
    unidade: "R$ milhões"
    fator: 0.001
    unidade_exibicao: "R$ bilhões"
    segmento: empresa
    papel: total
    bases: [nominal, real, pib, var1m, var12m]
    descricao_esperada: "Saldo da carteira de crédito a pessoas jurídicas — total por atividade econômica (soma calculada)"

  # ---------------------------------------------------------------------------
  # G15 — inadimplência total do crédito PJ por porte (Tabela 23)
  #
  # Taxa não é aditiva: o total é a média ponderada pelos saldos de cada porte, que é
  # exatamente como o BCB constrói os seus próprios totais de inadimplência. A fórmula
  # foi verificada em 19/09/2026 num caso em que existe série oficial para comparar —
  # ponderando 21083 e 21084 pelos saldos 20540 e 20541, o resultado reproduz o total
  # oficial 21082 com diferença de 0,004 pp.
  # ---------------------------------------------------------------------------
  - serie_id: inad_porte_total
    operacao: media_ponderada
    componentes:
      - serie: inad_porte_mpme
        peso: porte_mpme
      - serie: inad_porte_grande
        peso: porte_grande
    rotulo: "Total"
    cor: total
    unidade: "%"
    fator: 1
    unidade_exibicao: "% da carteira"
    segmento: empresa
    papel: total
    bases: []
    descricao_esperada: "Inadimplência da carteira de crédito a pessoas jurídicas — total por porte (média ponderada pelos saldos)"
