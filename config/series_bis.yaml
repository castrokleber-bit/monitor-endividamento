# Catálogo de séries — BIS (Bank for International Settlements), coleta direta via SDMX
#
# Referência internacional comparável de dívida por setor em % do PIB (base "Total credit
# to the non-financial sector", dataflow WS_TC).
#
# `rotulo` é o texto curto usado na legenda do gráfico.
# Endpoint: https://stats.bis.org/api/v2/data/dataflow/BIS/WS_TC/2.0/{codigo}?format=csv
# Sem chave de API.
#
# FONTE TROCADA EM 30/09/2026: até então estas séries vinham do FRED, que as redistribui
# com os códigos QBRHAM770A etc. (ver o fim do arquivo). O FRED repassa cada divulgação
# trimestral do BIS com atraso de meses — em 30/09/2026 o BIS já publicava o 1º tri/2026
# e o FRED seguia no 4º tri/2025, sem atualização desde 15/06/2026. São as mesmas séries:
# o histórico coincide observação a observação, exceto revisões de 0,1 p.p. que o BIS
# já incorporou e o FRED não.
#
# `descricao_esperada` é o TITLE_TS do BIS, conferido pelo nível 2 do gate.
#
# Código = chave SDMX: FREQ.PAÍS.SETOR.CREDORES.VALORAÇÃO.UNIDADE.AJUSTE
#   setor: H = famílias | N = empresas não financeiras | P = setor privado não financeiro
#   credores A = todos os setores | valoração M = valor de mercado
#   unidade 770 = % do PIB | ajuste A = ajustado para quebras

fonte: BIS

series:

  # ---------------------------------------------------------------
  # BIS — dívida por setor, % do PIB, comparável entre países
  #
  # `pais` é metadado descritivo. A cor de cada curva vem do campo `cor` (o Brasil é
  # `total`), não da posição da série no gráfico, desde a direção visual de 19/09/2026;
  # por isso não há mais verificação de ordem em `build_dataset.py`.
  # ---------------------------------------------------------------
  - serie_id: bis_familias_br
    codigo: "Q.BR.H.A.M.770.A"
    pais: BR
    rotulo: "Brasil"
    cor: total
    descricao_esperada: "Brazil - Credit to Households and NPISHs from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: familia
    validar: false

  - serie_id: bis_empresas_br
    codigo: "Q.BR.N.A.M.770.A"
    pais: BR
    rotulo: "Brasil"
    cor: total
    descricao_esperada: "Brazil - Credit to Non-financial corporations from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: empresa
    validar: false

  - serie_id: bis_privado_br
    codigo: "Q.BR.P.A.M.770.A"
    pais: BR
    rotulo: "Brasil — setor privado não financeiro"
    cor: total
    descricao_esperada: "Brazil - Credit to Private non-financial sector from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: ambos
    validar: false

  - serie_id: bis_familias_us
    codigo: "Q.US.H.A.M.770.A"
    pais: US
    rotulo: "Estados Unidos"
    cor: dir
    descricao_esperada: "United States - Credit to Households and NPISHs from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: familia
    validar: false

  - serie_id: bis_empresas_us
    codigo: "Q.US.N.A.M.770.A"
    pais: US
    rotulo: "Estados Unidos"
    cor: dir
    descricao_esperada: "United States - Credit to Non-financial corporations from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: empresa
    validar: false

  - serie_id: bis_familias_mx
    codigo: "Q.MX.H.A.M.770.A"
    pais: MX
    rotulo: "México"
    cor: extra-1
    descricao_esperada: "Mexico - Credit to Households and NPISHs from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: familia
    validar: false

  - serie_id: bis_empresas_mx
    codigo: "Q.MX.N.A.M.770.A"
    pais: MX
    rotulo: "México"
    cor: extra-1
    descricao_esperada: "Mexico - Credit to Non-financial corporations from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: empresa
    validar: false

  - serie_id: bis_familias_cl
    codigo: "Q.CL.H.A.M.770.A"
    pais: CL
    rotulo: "Chile"
    cor: extra-2
    descricao_esperada: "Chile - Credit to Households and NPISHs from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: familia
    validar: false

  - serie_id: bis_empresas_cl
    codigo: "Q.CL.N.A.M.770.A"
    pais: CL
    rotulo: "Chile"
    cor: extra-2
    descricao_esperada: "Chile - Credit to Non-financial corporations from All sectors at Market value - Percentage of GDP - Adjusted for breaks"
    unidade: "% do PIB"
    periodicidade: T
    aba: internacional
    segmento: empresa
    validar: false

# ---------------------------------------------------------------
# CÓDIGOS ANTERIORES NO FRED (fonte até 30/09/2026)
#
#   bis_familias_br QBRHAM770A   bis_empresas_br QBRNAM770A   bis_privado_br QBRPAM770A
#   bis_familias_us QUSHAM770A   bis_empresas_us QUSNAM770A
#   bis_familias_mx QMXHAM770A   bis_empresas_mx QMXNAM770A
#   bis_familias_cl QCLHAM770A   bis_empresas_cl QCLNAM770A
#
# ---------------------------------------------------------------
# RETIRADAS DO CATÁLOGO EM 30/08/2026 (séries do FRED, não do BIS)
#
# Quatro séries que só descreviam os Estados Unidos, sem contraparte brasileira, saíram
# junto com os dois gráficos que as exibiam. Não são mais coletadas nem publicadas:
#
#   TDSP       Household Debt Service Payments as a Percent of Disposable Personal Income
#   FODSP      Household Financial Obligations as a Percent of Disposable Personal Income
#              (descontinuada na fonte, última observação em 2023-07-01)
#   DRCCLACBS  Delinquency Rate on Credit Card Loans, All Commercial Banks
#   DRBLACBS   Delinquency Rate on Business Loans, All Commercial Banks
#
# Os códigos ficam registrados aqui porque foram conferidos contra a API e voltariam
# a funcionar se um dia houver decisão de reincluí-las.
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# NOTA METODOLÓGICA OBRIGATÓRIA
# ---------------------------------------------------------------
# As séries do BIS medem crédito ao setor de TODAS as fontes (bancos, mercado de
# capitais, credores externos), enquanto as séries do BCB medem apenas crédito do SFN.
# NÃO são diretamente comparáveis. No painel, elas ficam em blocos separados e a
# diferença de abrangência precisa estar escrita no rodapé do gráfico internacional.
# Esta é exatamente a crítica que o BCB ou o mercado usariam para desqualificar o
# monitor — a nota metodológica é a blindagem.
