# Catálogo de séries — Banco Central do Brasil / SGS
#
# Fonte única da verdade da coleta. Nenhum código de série vive em Python.
#
# Campos:
#   serie_id            slug interno, estável; é a chave em todo o pipeline
#   codigo              código no SGS
#   rotulo              texto curto da legenda do gráfico
#   descricao_esperada  nome da série na tabela de origem do BCB, sem encurtar
#   tabela              tabela das "Estatísticas monetárias e de crédito" de origem
#   unidade             unidade ORIGINAL da fonte — é nela que o valor é armazenado
#   fator               multiplicador para a unidade de exibição (ver abaixo)
#   unidade_exibicao    unidade mostrada na página depois de aplicado o fator
#   periodicidade       M, T ou A
#   segmento            familia | empresa | ambos
#   bases               transformações aplicáveis (config/graficos.yaml escolhe quais usar)
#   validar             true = código ainda NÃO conferido contra a API
#
# CONVERSÃO DE UNIDADE. O SGS publica todos os saldos de crédito em R$ milhões. A página
# exibe em R$ bilhões, então `fator: 0.001`. A conversão é de EXIBIÇÃO: o valor gravado
# em data/series.parquet, em data/series.json e nas abas temáticas da planilha segue na
# unidade original da fonte, como manda o formato canônico do CLAUDE.md. Quem aplica o
# fator é src/transformacoes.py, e a regra está em content/metodologia.md.
#
# BASES. `bases` declara quais opções do seletor "Base de valores" fazem sentido para a
# série. Saldo aceita as cinco; série já em % não aceita nenhuma — taxa não se deflaciona
# nem se divide pelo PIB. A variação (mensal ou em 12 meses) de série em % — que seria
# diferença em pontos percentuais — está prevista mas NÃO implementada, por decisão de
# 19/09/2026; por isso `bases: []` em toda série que já é percentual.
#
# Endpoint: https://api.bcb.gov.br/dados/serie/bcdata.sgs.{codigo}/dados?formato=json

fonte: BCB/SGS

# DADO PRELIMINAR. Nas tabelas de estatísticas monetárias e de crédito, o Banco Central
# publica o mês mais recente marcado com asterisco: é preliminar e pode mudar na
# divulgação seguinte. Não há como ler esse asterisco pela API — ele vive no PDF e na
# planilha da divulgação —, então a marcação é feita por REGRA declarada, e não por
# inferência: toda série cujo campo `tabela` comece com o prefixo abaixo tem a sua última
# observação marcada como preliminar. O front desenha esse ponto com círculo vazado em
# vez de preenchido, e a Metodologia explica.
#
# A regra se propaga às séries derivadas, e deve mesmo: um residual calculado sobre um
# mês preliminar também é preliminar.
prefixo_tabela_preliminar: "Tabela "

# ESTOQUE E FLUXO. O campo `agregacao` diz se a série é um saldo (`estoque`) ou uma
# concessão (`fluxo`). Ele governa duas bases do seletor, em `src/transformacoes.py`:
#
#   acum12m   só existe para fluxo. Somar doze saldos somaria o mesmo estoque doze vezes.
#   pib       para estoque é `valor(t) / PIB12m(t)`; para fluxo é a soma dos doze últimos
#             meses sobre o mesmo PIB de doze meses, porque dividir uma concessão mensal
#             por um PIB anual devolveria um número sem significado.
#
# O padrão é `estoque`, e por isso as séries de saldo não precisam declarar o campo. Toda
# série de concessão declara `agregacao: fluxo` — e o build recusa o catálogo se uma série
# que oferece `acum12m` não o fizer (`confere_agregacao` em src/build_dataset.py).

# Âncoras YAML reutilizadas. Não são campos do catálogo.
_bases_saldo: &bases_saldo [nominal, real, pib, var1m, var12m]
_bases_concessao: &bases_concessao [nominal, real, acum12m, pib, var1m, var12m]

series:

  # =================================================================
