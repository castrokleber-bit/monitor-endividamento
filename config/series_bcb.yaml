  #
  # A regra é da fonte, não deste painel. A nota 7/ da Tabela 11 do BCB diz, textualmente:
  # "New operations in credit card revolving credit and credit card financing credit are
  # not included in the new operations total" — ou seja, o rotativo e o parcelado do
  # cartão não integram o total de concessões, embora integrem o total de saldo.
  # Conferido aritmeticamente em 26/09/2026, nos 185 meses: com o cartão À VISTA, a soma
  # das modalidades publicadas fecha em 20662 com divergência máxima de 0,0023%; com o
  # cartão TOTAL, estoura o total em até 19,9%, e o residual do gráfico ficaria NEGATIVO
  # em 14 dos 185 meses.
