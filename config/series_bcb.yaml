  # =================================================================

  # O SGS não publica número-índice do IPCA utilizável: o código 1737 devolve HTML com
  # status 200, exatamente a armadilha registrada no CLAUDE.md. O índice de preços é
  # encadeado no pipeline a partir da variação mensal, em src/transformacoes.py.
  - serie_id: ipca_variacao_mensal
    codigo: 433
    rotulo: "IPCA — variação mensal"
    descricao_esperada: "Índice nacional de preços ao consumidor-amplo (IPCA) - variação mensal"
    tabela: "SGS — índices de preços"
    unidade: "% ao mês"
    fator: 1
    unidade_exibicao: "% ao mês"
    periodicidade: M
    segmento: ambos
    papel: deflator
    bases: []
    validar: false

  # Denominador de todas as séries em % do PIB. Publicada em R$ milhões correntes,
