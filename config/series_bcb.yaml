  # status 200, exatamente a armadilha registrada no CLAUDE.md. O índice de preços é
  # encadeado no pipeline a partir da variação mensal, em src/transformacoes.py.
  - serie_id: ipca_variacao_mensal
    codigo: 433
    rotulo: "IPCA — variação mensal"
    descricao_esperada: "Índice nacional de preços ao consumidor-amplo (IPCA)"
    tabela: "SGS — índices de preços"
    unidade: "% ao mês"
