  # =================================================================
  # G21 a G24 — Concessões de crédito do SFN (Tabelas 2 a 5)
  #
  # CONCESSÃO É FLUXO, SALDO É ESTOQUE. A concessão de um mês é o volume contratado
  # NAQUELE mês; o saldo é a carteira viva no fim do mês. Um não se compara com o outro
  # em nível, e é por isso que as duas coisas vivem em abas separadas, com os títulos
  # dizendo qual é qual. Todas as séries daqui declaram `agregacao: fluxo`.
  #
  # As mesmas Tabelas 2 a 5 que publicam o saldo publicam a concessão, lado a lado, com
  # o mesmo recorte — o que permitiu replicar os gráficos G4 a G7 um a um.
  #
  # Identidades conferidas contra a API em 26/09/2026, nos 185 meses de 03/2011 a
  # 07/2026, com divergência máxima de 0,005% (arredondamento independente na fonte):
  #   20632 + 20633 = 20631   (PJ + PF = total)
  #   20634 + 20685 = 20631   (livre + direcionado = total)
  #   20635 + 20662 = 20634   (livre PJ + PF)
  #   20686 + 20698 = 20685   (direcionado PJ + PF)
  #
  # COBERTURA MAIS CURTA QUE A DO SALDO. A concessão começa em 03/2011; o saldo, em
  # 03/2007 (e o total do SFN, em 06/1988). Não há emenda com série anterior: a aba de
  # concessões simplesmente começa em 2011.
  #
  # SÉRIE SEM AJUSTE SAZONAL, POR ESCOLHA. O BCB publica também as concessões
  # dessazonalizadas, nos códigos 24439 a 24447. O painel NÃO as usa: o pipeline não
  # aplica nem remove ajuste sazonal em série nenhuma, e misturar uma série ajustada com
  # os saldos, que não são, daria duas convenções sob o mesmo seletor. A base
  # "Acumulado em 12 meses" é o que este painel oferece para ler a série sem o desenho
  # sazonal, e a Metodologia diz isso.
  # =================================================================

