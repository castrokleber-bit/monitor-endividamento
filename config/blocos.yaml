# Organização temática da página. Define ordem, títulos e agrupamento dos gráficos.
# O front lê este arquivo (via data/series.json) para montar a página.

# Recorte temporal da EXIBIÇÃO. Vale para todos os gráficos; um gráfico pode
# sobrescrever com seu próprio `inicio`.
#
# Não afeta a camada de dados: data/series.parquet, data/series.json e a planilha
# seguem com a série inteira, desde a primeira observação da fonte. O recorte existe
# porque as séries do BIS para os EUA começam em 1947 e as do Brasil em 1994 — sem ele,
# a trajetória brasileira fica espremida no canto direito do gráfico.
recorte:
  inicio: "2005-01-01"

blocos:
  # `aba` é o nome da aba na planilha. O Excel limita a 31 caracteres, e sem um nome
  # explícito o título longo sairia cortado no meio da palavra.
  - id: familias_estoque
    titulo: "Famílias — estoque de dívida"
    aba: "Famílias — estoque"
    subtitulo: "Quanto as famílias devem em relação à renda que recebem"
    graficos:
      - titulo: "Endividamento das famílias"
        series: [endividamento_familias_total, endividamento_familias_ex_habitacional]
        unidade: "% da renda acumulada em 12 meses"
        fonte: "Banco Central do Brasil"

  - id: familias_capacidade
    titulo: "Famílias — capacidade de pagamento"
    aba: "Famílias — capacidade"
    subtitulo: "Quanto da renda mensal vai para o serviço da dívida e quanto disso vira atraso"
    graficos:
      - titulo: "Comprometimento de renda com o serviço da dívida"
        series: [comprometimento_renda_sa, comprometimento_renda_nsa]
        unidade: "% da renda mensal"
        fonte: "Banco Central do Brasil"
      - titulo: "Composição do comprometimento: juros e amortização"
        series: [comprometimento_juros, comprometimento_amortizacao]
        unidade: "% da renda mensal"
        fonte: "Banco Central do Brasil"
      - titulo: "Inadimplência das pessoas físicas por modalidade"
        series: [inadimplencia_pf_total, inadimplencia_pf_abertura_1, inadimplencia_pf_abertura_2]
        rotulos:
          inadimplencia_pf_total: "Total"
          inadimplencia_pf_abertura_1: "Recursos livres"
          inadimplencia_pf_abertura_2: "Cheque especial"
        unidade: "% da carteira"
        fonte: "Banco Central do Brasil"
        nota: >-
          As três séries são aninhadas, não somáveis: o cheque especial está dentro dos
          recursos livres, que estão dentro do total. O total inclui ainda o crédito
          direcionado — habitacional e rural —, de inadimplência estruturalmente baixa,
          o que puxa a curva agregada para baixo. O nível do cheque especial é uma ordem
          de grandeza maior que o das demais e ocupa parcela pequena da carteira.

  - id: mercado_credito
    titulo: "Mercado de crédito"
    aba: "Mercado de crédito"
    subtitulo: "Estoque, alavancagem e qualidade da carteira do Sistema Financeiro Nacional"
    graficos:
      # O total vem primeiro para receber o azul institucional, como nos demais gráficos
      # do bloco: agregado na primeira cor, aberturas depois.
      - titulo: "Saldo da carteira de crédito em relação ao PIB"
        series: [credito_pib_total, credito_pib_pj, credito_pib_pf]
        unidade: "% do PIB"
        fonte: "Banco Central do Brasil"

      # `{base_ipca}` é substituído no build pelo mês-base do deflator — a base é móvel,
      # acompanha o último IPCA divulgado. Ver config/derivadas.yaml.
      - titulo: "Saldo da carteira de crédito, a preços constantes"
        series: [saldo_credito_total_real, saldo_credito_pj_real, saldo_credito_pf_real]
        rotulos:
          saldo_credito_total_real: "Total"
          saldo_credito_pj_real: "Pessoas jurídicas"
          saldo_credito_pf_real: "Pessoas físicas"
        unidade: "R$ milhões de {base_ipca}"
        fonte: "Banco Central do Brasil"
        nota: >-
          Saldo deflacionado pelo IPCA e expresso a preços do mês mais recente do índice,
          para separar expansão real do crédito de variação de preços. A fonte divulga o
          saldo em valores nominais; o deflacionamento é calculado no pipeline, pela regra
          descrita na nota metodológica. A planilha traz as duas versões, nominal e a
          preços constantes.

      - titulo: "Inadimplência da carteira de crédito"
        series: [inadimplencia_total_sfn, inadimplencia_pj_total, inadimplencia_pf_total]
        rotulos:
          inadimplencia_total_sfn: "Total"
          inadimplencia_pj_total: "Pessoas jurídicas"
          inadimplencia_pf_total: "Pessoas físicas"
        unidade: "% da carteira"
        fonte: "Banco Central do Brasil"

  - id: empresas_credito
    titulo: "Empresas — composição do crédito"
    aba: "Empresas — crédito"
    subtitulo: "De onde vem e com que prazo se contrata o crédito das pessoas jurídicas"
    graficos:
      - titulo: "Crédito livre e crédito direcionado"
        series: [saldo_credito_pj_livre_real, saldo_credito_pj_direcionado_real]
        unidade: "R$ milhões de {base_ipca}"
        fonte: "Banco Central do Brasil"
        nota: >-
          Recursos livres são as operações com taxa livremente pactuada; recursos
          direcionados são as de destinação e taxa reguladas, incluídas as lastreadas
          em recursos do BNDES. As duas somam o saldo da carteira de pessoas jurídicas.
          Séries deflacionadas pelo IPCA, pela regra da nota metodológica; a planilha
          traz também os valores nominais.

      - titulo: "Capital de giro por prazo de contratação"
        series: [capital_giro_ate_365d_real, capital_giro_acima_365d_real]
        unidade: "R$ milhões de {base_ipca}"
        fonte: "Banco Central do Brasil"
        nota: >-
          Capital de giro é uma modalidade dentro dos recursos livres, não um recorte do
          crédito às empresas como um todo. As duas séries não esgotam a modalidade: a
          fonte publica ainda o capital de giro rotativo, de saldo pequeno e natureza
          distinta, que não entra neste gráfico. Ambas começam em março de 2011, quando
          a fonte passou a publicar a abertura por prazo. Deflacionadas pelo IPCA.

  - id: internacional
    titulo: "Comparação internacional"
    subtitulo: "Dívida de famílias e empresas em % do PIB — base BIS, abrangência mais ampla que a do SFN"
    nota_metodologica: >-
      As séries do BIS incluem crédito de todas as fontes (bancos, mercado de capitais e
      credores externos). As séries do BCB apresentadas nos blocos anteriores cobrem apenas
      o Sistema Financeiro Nacional. Os níveis não são diretamente comparáveis entre blocos.
    graficos:
      - titulo: "Dívida das famílias — Brasil e comparáveis"
        series: [bis_familias_br, bis_familias_us, bis_familias_mx, bis_familias_cl]
        unidade: "% do PIB"
        fonte: "BIS, via FRED"
      - titulo: "Dívida das empresas não financeiras — Brasil e comparáveis"
        series: [bis_empresas_br, bis_empresas_us, bis_empresas_mx, bis_empresas_cl]
        unidade: "% do PIB"
        fonte: "BIS, via FRED"

      # `rotulos` sobrescreve o rótulo do catálogo dentro deste gráfico. Aqui é
      # necessário: as três séries são do Brasil e o rótulo padrão de todas é "Brasil".
      - titulo: "Composição da dívida privada — Brasil"
        series: [bis_privado_br, bis_familias_br, bis_empresas_br]
        rotulos:
          bis_privado_br: "Setor privado não financeiro"
          bis_familias_br: "Famílias"
          bis_empresas_br: "Empresas não financeiras"
        unidade: "% do PIB"
        fonte: "BIS, via FRED"
        nota: >-
          O setor privado não financeiro é, na definição do BIS, a soma de famílias e
          empresas não financeiras. As três séries são divulgadas arredondadas de forma
          independente, então a soma das duas componentes pode diferir do total em até
          0,5 ponto percentual em um trimestre. Mesma abrangência ampla do bloco: inclui
          crédito bancário, mercado de capitais e credores externos.

