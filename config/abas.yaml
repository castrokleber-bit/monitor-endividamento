# Organização da página: abas, gráficos e controles.
#
# Fonte única da verdade da montagem do painel. O front lê este arquivo (via
# docs/dados.js) e monta as abas, os cartões, o seletor de base e o seletor de período.
# `build_xlsx.py` usa a mesma lista para agrupar as séries nas abas da planilha, e
# `build_metodologia.py` para dizer, na ficha de cada série, em que gráficos ela aparece.
#
# REFORMULAÇÃO DE 19/09/2026. Três mudanças estruturais em relação à versão anterior:
#
#   1. O recorte fixo de exibição a partir de 2005 acabou. Cada gráfico abre na série
#      completa e o leitor escolhe o intervalo. Ver `periodos` abaixo.
#   2. O filtro Família / Empresas / Ambos foi retirado. O recorte por tomador agora é
#      feito por gráficos específicos (G2 e G3, G5, G6, G7), não por um filtro global.
#      O campo `segmento` do catálogo continua existindo: virou metadado da ficha de
#      série na aba Metodologia.
#   3. As notas explicativas saíram dos cartões. Cada gráfico tem um ícone "i" que leva
#      à âncora correspondente na aba Metodologia, gerada a partir do catálogo.

# ---------------------------------------------------------------------------
# Seletor "Base de valores" — as seis transformações de src/transformacoes.py.
#
# `sufixo` é o que entra no nome da coluna na planilha de download, padronizado em
# 19/09/2026: antes só existia `_real`.
#
# ESTOQUE E FLUXO (26/09/2026). Duas bases dependem de a série ser um saldo ou uma
# concessão, e o catálogo declara isso no campo `agregacao`:
#
#   acum12m   só é oferecida nos gráficos de concessão. Somar doze saldos somaria o mesmo
#             estoque doze vezes, e `transformacoes.aplica` recusa a combinação.
#   pib       para saldo é `valor(t) / PIB12m(t)`; para concessão o numerador é a soma dos
#             doze últimos meses, para ficar na mesma base de tempo do denominador.
#
# Um gráfico só oferece uma base se TODAS as suas séries a declararem — `confere_bases`
# em src/build_dataset.py. É por isso que `acum12m` aparecer na lista global não a faz
# aparecer nos gráficos de saldo.
# ---------------------------------------------------------------------------
bases:
  - id: nominal
    rotulo: "R$ correntes"
    sufixo: _nominal
    descricao: "Valor como a fonte divulga, convertido para a unidade de exibição."
  - id: real
    rotulo: "R$ constantes"
    sufixo: _real
    descricao: >-
      Valor deflacionado pelo IPCA e expresso a preços do mês mais recente do índice.
      O mês-base é móvel e aparece no rótulo do eixo.
  - id: acum12m
    rotulo: "Acumulado em 12 meses"
    sufixo: _acum12m
    descricao: >-
      Soma das doze últimas observações mensais, em valores correntes. Só existe para as
      séries de concessão, que são fluxo: acumular saldos não teria significado. Os onze
      primeiros meses de cada série ficam vazios, sem preenchimento, e a soma reúne
      valores correntes de doze meses diferentes — não está a preços de um único mês.
  - id: pib
    rotulo: "% do PIB"
    sufixo: _pib
    descricao: >-
      Divisão pelo PIB acumulado em 12 meses a valores correntes (SGS 4382). No saldo o
      numerador é o valor do mês; na concessão é a soma dos doze últimos meses, para que
      numerador e denominador cubram o mesmo intervalo de tempo.
  - id: var1m
    rotulo: "Variação mensal"
    sufixo: _var1m
    descricao: >-
      Variação percentual do valor nominal contra o mês anterior. A primeira observação
      de cada série fica vazia, sem preenchimento. A série não é dessazonalizada, e os
      saldos de crédito têm sazonalidade marcada.
  - id: var12m
    rotulo: "Variação em 12 meses"
    sufixo: _var12m
    descricao: >-
      Variação percentual do valor nominal contra o mesmo mês do ano anterior. Os doze
      primeiros meses de cada série ficam vazios, sem preenchimento.

# ---------------------------------------------------------------------------
# Seletor de período. `anos: null` é "Tudo" — da primeira observação ao último dado.
# O leitor pode ainda digitar um intervalo personalizado em dois campos mês/ano.
# Cada gráfico tem o seu seletor; cada aba tem um seletor global que sobrescreve os
# individuais quando acionado.
# ---------------------------------------------------------------------------
periodos:
  - { id: tudo, rotulo: "Tudo", anos: null }
  - { id: a10, rotulo: "10 anos", anos: 10 }
  - { id: a5, rotulo: "5 anos", anos: 5 }
  - { id: a3, rotulo: "3 anos", anos: 3 }
  - { id: a1, rotulo: "1 ano", anos: 1 }
periodo_padrao: tudo

# ---------------------------------------------------------------------------
# `inicio` de um gráfico define onde "Tudo" começa:
#
#   comum          (padrão) a primeira data em que TODAS as séries do gráfico têm
#                  observação. Evita exibir um total sozinho, sem as aberturas que o
#                  compõem, num trecho em que a soma das parcelas não fecha no total.
#   uniao          a primeira observação de qualquer série do gráfico.
#   "AAAA-MM-DD"   data fixa, quando houver motivo documentado na Metodologia.
#
# O padrão é `comum` por causa de um caso concreto: a série 20539 (total do SFN) tem
# observações desde 06/1988, mas todas as suas aberturas começam em 03/2007, e os
# valores anteriores a 1994 estão reexpressos em reais a ponto de serem degenerados
# (06/1988 = R$ 0). Com `uniao`, G4 e G5 abririam numa linha reta no zero por vinte anos.
# O recorte é só de exibição: data/, a planilha e o CSV do gráfico seguem com a série
# inteira desde a primeira observação da fonte.
inicio_padrao: comum

# ---------------------------------------------------------------------------
# `largura` é a fração de doze colunas que o cartão ocupa, conforme a direção visual de
# 19/09/2026: gráfico de abertura da aba 8/12, gráficos de três ou quatro séries 4/12,
# gráficos de modalidade (seis ou mais séries) 12/12. As larguras de cada aba somam
# doze por linha.
#
# Exceção declarada: G17a e G17b ficam 6/12 cada. São dois painéis que existem para ser
# comparados lado a lado — endividamento e comprometimento —, e larguras diferentes
# atrapalhariam exatamente a leitura que eles servem.
#
# Um cartão sozinho numa linha incompleta é esticado pelo front até fechar as doze
# colunas, para não deixar buraco quando um gráfico não é montado por falta de série.
# ---------------------------------------------------------------------------

abas:

  # =========================================================================
  # ABA 1 — SALDO DO CRÉDITO
  #
  # RENOMEADA EM 26/09/2026, junto com a entrada da aba de concessões. O nome antigo,
  # "Mercado de crédito", não dizia qual das duas medidas a aba traz — e agora o painel
  # traz as duas. Saldo é estoque: a carteira viva no fim do mês. Cada título de gráfico
  # desta aba começa por "Saldo", e cada título da aba seguinte por "Concessões".
  # =========================================================================
  - id: mercado_credito
    titulo: "Saldo do crédito"
    subtitulo: >-
      Estoque de crédito ao setor não financeiro no fim de cada mês, por origem dos
      recursos, por tomador, por modalidade, por porte da empresa e por atividade
      econômica.
    graficos:

      - id: g1
        titulo: "Saldo do crédito ampliado ao setor não financeiro"
        largura: 8
        series: [amplo_total, amplo_emprestimos, amplo_titulos, amplo_divida_externa]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-credito-ampliado

      - id: g2
        titulo: "Saldo do crédito ampliado às empresas"
        largura: 4
        series: [amplo_emp_total, amplo_emp_emprestimos, amplo_emp_titulos, amplo_emp_divida_externa]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-credito-ampliado

      - id: g3
        titulo: "Saldo do crédito ampliado às famílias"
        largura: 4
        series: [amplo_fam_total, amplo_fam_emprestimos, amplo_fam_titulos, amplo_fam_divida_externa]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-credito-ampliado

      - id: g4
        titulo: "Saldo do crédito do SFN por origem dos recursos"
        largura: 4
        series: [sfn_total, sfn_direcionado, sfn_livre]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-livre-direcionado

      - id: g5
        titulo: "Saldo do crédito do SFN por tipo de tomador"
        largura: 4
        series: [sfn_total, sfn_pj, sfn_pf]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-credito-sfn

      - id: g6
        titulo: "Saldo do crédito direcionado por tipo de tomador"
        largura: 4
        series: [sfn_direcionado, sfn_direcionado_pj, sfn_direcionado_pf]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-livre-direcionado

      - id: g7
        titulo: "Saldo do crédito livre por tipo de tomador"
        largura: 4
        series: [sfn_livre, sfn_livre_pj, sfn_livre_pf]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-livre-direcionado

      - id: g8
        titulo: "Saldo do crédito livre às empresas por modalidade"
        largura: 12
        series:
          - sfn_livre_pj
          - livre_pj_capital_giro_acima_365d
          - livre_pj_capital_giro_ate_365d
          - livre_pj_duplicatas
          - livre_pj_veiculos
          - livre_pj_exportacoes
          - livre_pj_acc
          - livre_pj_outros
        # O rótulo do catálogo para 20543 é "Pessoas jurídicas", que é o que ele significa
        # nos gráficos por tomador. Aqui ele é o agregado das modalidades, e "Total" lê
        # melhor na legenda ao lado de "Capital de giro" e "Desconto de duplicatas".
        rotulos:
          sfn_livre_pj: "Total"
        # 20543 é a linha de PJ (ocre) nos gráficos por tomador e o AGREGADO aqui. A
        # regra da direção visual é "Total é petróleo em todos os gráficos", então o
        # papel de cor muda junto com o papel da série.
        cores:
          sfn_livre_pj: total
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-modalidades-pj

      - id: g9
        titulo: "Saldo do crédito livre às famílias por modalidade"
        largura: 12
        series:
          - sfn_livre_pf
          - livre_pf_consignado
          - livre_pf_nao_consignado
          - livre_pf_cartao
          - livre_pf_veiculos
          - livre_pf_outros
        rotulos:
          sfn_livre_pf: "Total"
        cores:
          sfn_livre_pf: total
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-modalidades-pf

      - id: g14
        titulo: "Saldo do crédito às empresas por porte"
        largura: 4
        series: [porte_total, porte_mpme, porte_grande]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-porte

      - id: g16
        titulo: "Saldo do crédito às empresas por atividade econômica"
        largura: 12
        series: [ativ_total, ativ_agropecuaria, ativ_industria, ativ_servicos, ativ_outros]
        bases: [nominal, real, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-atividade
        # Segundo nível: o seletor troca a linha "Indústria" pelas dezesseis séries que
        # a compõem. As dezesseis somam exatamente 22043 em todos os meses comuns — a
        # abertura não precisa de parcela residual.
        detalhe:
          rotulo: "Detalhar indústria"
          substitui: ativ_industria
          por:
            - ind_siup
            - ind_construcao
            - ind_alimentos
            - ind_acucar
            - ind_textil
            - ind_papel
            - ind_petroleo
            - ind_metalurgia
            - ind_quimica
            - ind_bens_capital
            - ind_automobilistica
            - ind_mineracao
            - ind_infraestrutura
            - ind_outros_duraveis
            - ind_embalagens
            - ind_nao_duraveis

  # =========================================================================
  # ABA 2 — CONCESSÕES DE CRÉDITO (nova em 26/09/2026)
  #
  # Replica, um a um, os gráficos de saldo que têm equivalente em concessão: G21 a G24
  # espelham G4 a G7, e G25 e G26 espelham G8 e G9. Mesmas séries, mesmas cores, mesma
  # ordem — o que muda é a tabela de origem no BCB e o fato de o número ser fluxo.
  #
  # O QUE NÃO TEM EQUIVALENTE, e por isso não está aqui:
  #
  #   G1 a G3   crédito ampliado. É um conceito de estoque (saldo de empréstimos, títulos
  #             de dívida e dívida externa). A fonte não publica concessão para ele.
  #   G14       por porte da empresa (Tabela 23). A tabela publica saldo e inadimplência,
  #             não concessão.
  #   G16       por atividade econômica (Tabela 24). Mesma situação da Tabela 23.
  #
  # Conferido em 26/09/2026 contra o SGS e contra a planilha de tabelas do próprio BCB:
  # as Tabelas 23 e 24 não têm coluna de concessões, e o crédito ampliado não tem série
  # de fluxo. Não inventar as três aberturas por simetria.
  #
  # LAYOUT. G21 é o gráfico de abertura (8/12) e G22 fecha a primeira linha (4/12). G23 e
  # G24 somam 8/12 na segunda linha, e o front estica o último cartão para fechar as doze
  # colunas — a mesma situação de G6 e G7 na aba de saldo. G25 e G26 são de modalidade e
  # ocupam a largura inteira.
  # =========================================================================
  - id: concessoes
    titulo: "Concessões de crédito"
    subtitulo: >-
      Volume de crédito contratado em cada mês pelo Sistema Financeiro Nacional, por
      origem dos recursos, por tomador e por modalidade.
    nota_metodologica: >-
      Concessão é fluxo e saldo é estoque: a concessão de um mês é o volume contratado
      naquele mês, e o saldo é a carteira viva no fim do mês. Os níveis das duas abas não
      se comparam. As séries de concessão começam em março de 2011, contra março de 2007
      das séries de saldo, e não são dessazonalizadas — a base "Acumulado em 12 meses" é
      o que o painel oferece para ler a série sem o desenho sazonal.
    graficos:

      - id: g21
        titulo: "Concessões de crédito do SFN por origem dos recursos"
        largura: 8
        series: [conc_total, conc_direcionado, conc_livre]
        bases: [nominal, real, acum12m, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-concessoes

      - id: g22
        titulo: "Concessões de crédito do SFN por tipo de tomador"
        largura: 4
        series: [conc_total, conc_pj, conc_pf]
        bases: [nominal, real, acum12m, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-concessoes

      - id: g23
        titulo: "Concessões de crédito direcionado por tipo de tomador"
        largura: 4
        series: [conc_direcionado, conc_direcionado_pj, conc_direcionado_pf]
        bases: [nominal, real, acum12m, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-concessoes

      - id: g24
        titulo: "Concessões de crédito livre por tipo de tomador"
        largura: 4
        series: [conc_livre, conc_livre_pj, conc_livre_pf]
        bases: [nominal, real, acum12m, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-concessoes

      - id: g25
        titulo: "Concessões de crédito livre às empresas por modalidade"
        largura: 12
        series:
          - conc_livre_pj
          - conc_livre_pj_capital_giro_acima_365d
          - conc_livre_pj_capital_giro_ate_365d
          - conc_livre_pj_duplicatas
          - conc_livre_pj_veiculos
          - conc_livre_pj_exportacoes
          - conc_livre_pj_acc
          - conc_livre_pj_outros
        # Mesma troca de papel de 20543 em G8: 20635 é a linha de PJ nos gráficos por
        # tomador e o agregado aqui, então muda de rótulo e de cor junto com o papel.
        rotulos:
          conc_livre_pj: "Total"
        cores:
          conc_livre_pj: total
        bases: [nominal, real, acum12m, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-concessoes-modalidades-pj

      - id: g26
        titulo: "Concessões de crédito livre às famílias por modalidade"
        largura: 12
        series:
          - conc_livre_pf
          - conc_livre_pf_consignado
          - conc_livre_pf_nao_consignado
          - conc_livre_pf_cartao_avista
          - conc_livre_pf_veiculos
          - conc_livre_pf_outros
        rotulos:
          conc_livre_pf: "Total"
        cores:
          conc_livre_pf: total
        bases: [nominal, real, acum12m, pib, var1m, var12m]
        base_padrao: nominal
        metodologia: conceito-concessoes-modalidades-pf

  # =========================================================================
  # ABA 3 — INADIMPLÊNCIA
  #
  # Todas as séries em % da carteira com atraso superior a 90 dias. Sem seletor de base:
  # taxa não se deflaciona nem se divide pelo PIB.
  # =========================================================================
  - id: inadimplencia
    titulo: "Inadimplência"
    subtitulo: >-
      Parcela da carteira ativa com atraso superior a noventa dias, por origem dos
      recursos, por tomador, por modalidade e por porte da empresa.
    graficos:

      - id: g10
        titulo: "Inadimplência por origem dos recursos"
        largura: 8
        series: [inad_sfn_total, inad_sfn_direcionado, inad_sfn_livre]
        bases: []
        metodologia: conceito-inadimplencia

      - id: g11
        titulo: "Inadimplência por tipo de tomador"
        largura: 4
        series: [inad_sfn_total, inad_sfn_pj, inad_sfn_pf]
        bases: []
        metodologia: conceito-inadimplencia

      - id: g12
        titulo: "Inadimplência do crédito livre às empresas por modalidade"
        largura: 12
        series:
          - inad_livre_pj_total
          - inad_livre_pj_capital_giro_acima_365d
          - inad_livre_pj_capital_giro_ate_365d
          - inad_livre_pj_duplicatas
          - inad_livre_pj_veiculos
          - inad_livre_pj_exportacoes
          - inad_livre_pj_acc
          - inad_livre_pj_outros
        bases: []
        metodologia: limitacao-dois-outros

      - id: g13
        titulo: "Inadimplência do crédito livre às famílias por modalidade"
        largura: 12
        series:
          - inad_livre_pf_total
          - inad_livre_pf_consignado
          - inad_livre_pf_nao_consignado
          - inad_livre_pf_cartao
          - inad_livre_pf_veiculos
          - inad_livre_pf_outros
        bases: []
        metodologia: limitacao-dois-outros

      - id: g15
        titulo: "Inadimplência das empresas por porte"
        largura: 12
        series: [inad_porte_total, inad_porte_mpme, inad_porte_grande]
        bases: []
        metodologia: conceito-porte

  # =========================================================================
  # ABA 4 — DÍVIDA DAS FAMÍLIAS
  #
  # Dois painéis, não dois eixos no mesmo gráfico: endividamento é saldo sobre renda de
  # doze meses e comprometimento é serviço da dívida sobre renda mensal. Escalas
  # diferentes num eixo duplo produzem leitura errada.
  # =========================================================================
  - id: divida_familias
    titulo: "Dívida das famílias"
    subtitulo: >-
      Quanto as famílias devem em relação à renda anual e quanto da renda mensal vai
      para o serviço da dívida.
    nota_metodologica: >-
      Esta aba cobre apenas famílias: o Banco Central não publica, para empresas não
      financeiras, indicador doméstico equivalente de endividamento em relação à renda
      ou de comprometimento de renda. A composição e a inadimplência do crédito livre a
      pessoas físicas estão nas abas Mercado de crédito e Inadimplência.
    graficos:

      - id: g17a
        titulo: "Endividamento das famílias"
        largura: 6
        series: [endividamento_familias_total, endividamento_familias_ex_habitacional]
        bases: []
        metodologia: conceito-endividamento-familias

      - id: g17b
        titulo: "Comprometimento de renda com o serviço da dívida"
        largura: 6
        series: [comprometimento_renda_total, comprometimento_renda_ex_habitacional]
        bases: []
        metodologia: conceito-comprometimento

  # =========================================================================
  # ABA 5 — COMPARAÇÃO INTERNACIONAL
  #
  # Conteúdo inalterado na reformulação de 19/09/2026, por orientação explícita. O que
  # mudou foi só o entorno: seletor de período no padrão novo e texto explicativo
  # movido para a aba Metodologia.
  # =========================================================================
  - id: internacional
    titulo: "Comparação internacional"
    subtitulo: >-
      Dívida de famílias e de empresas não financeiras em % do PIB, base BIS,
      abrangência mais ampla que a do Sistema Financeiro Nacional.
    nota_metodologica: >-
      As séries do BIS incluem crédito de todas as fontes — bancos, mercado de capitais
      e credores externos. As séries do Banco Central nas demais abas cobrem apenas o
      Sistema Financeiro Nacional. Os níveis não são comparáveis entre abas.
    graficos:

      - id: g18
        titulo: "Dívida das famílias — Brasil e comparáveis"
        largura: 8
        series: [bis_familias_br, bis_familias_us, bis_familias_mx, bis_familias_cl]
        bases: []
        metodologia: conceito-bis

      - id: g19
        titulo: "Dívida das empresas não financeiras — Brasil e comparáveis"
        largura: 4
        series: [bis_empresas_br, bis_empresas_us, bis_empresas_mx, bis_empresas_cl]
        bases: []
        metodologia: conceito-bis

      # `rotulos` sobrescreve o rótulo do catálogo dentro deste gráfico. Aqui é
      # necessário: as três séries são do Brasil e o rótulo padrão de todas é "Brasil".
      - id: g20
