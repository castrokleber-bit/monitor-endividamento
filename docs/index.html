<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor de Crédito e Endividamento</title>
  <meta name="description" content="Crédito, inadimplência, endividamento e comprometimento de renda de famílias e empresas não financeiras no Brasil, com comparação internacional. Dados do Banco Central e do BIS, atualizados quinzenalmente.">
  <meta name="color-scheme" content="light dark">

  <!-- Duas famílias variáveis. `display=swap` e a pilha de fallback em tokens.css
       garantem que a página fique legível antes de as fontes chegarem, e o `preconnect`
       evita que a espera pelo DNS atrase o primeiro texto. Sem rede, `system-ui` desenha
       tudo sem quebrar o layout. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&amp;family=Hanken+Grotesk:wght@400..700&amp;display=swap">

  <link rel="stylesheet" href="tokens.css?v=092f7a0e22">
  <link rel="stylesheet" href="style.css?v=092f7a0e22">
</head>
<body>

<div class="pagina">

  <!-- Abertura sem hero de dashboard: título, uma frase, a data da última atualização.
       O primeiro gráfico aparece na primeira dobra. -->
  <header class="cabecalho">
    <div class="cabecalho__topo">
      <h1 class="cabecalho__titulo">Monitor de Crédito e Endividamento</h1>
      <a class="link-discreto" href="monitor_endividamento.xlsx" download>Baixar XLSX</a>
    </div>
    <p class="cabecalho__linha" id="cabecalho-linha">
      Famílias e empresas não financeiras — crédito, inadimplência e dívida.
    </p>
    <p class="aviso" id="aviso-global" hidden></p>
  </header>

  <!-- Navegação sticky, preenchida por app.js a partir de window.MONITOR. -->
  <nav class="abas" id="abas-nav" aria-label="Seções do monitor"></nav>

  <main id="abas-paineis">
    <p class="carregando" id="carregando">Carregando as séries…</p>
  </main>

  <footer class="rodape">
    <p id="rodape-fonte"></p>
    <p class="rodape__autor">Kleber Pacheco de Castro</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="dados.js"></script>
<script src="app.js?v=092f7a0e22"></script>

</body>
</html>
